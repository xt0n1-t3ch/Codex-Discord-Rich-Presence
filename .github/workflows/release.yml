name: Release

# Manual-only on purpose: releases are normally built locally with `cargo xtask`,
# and Actions minutes stay reserved for essentials. Pushing a tag never starts it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The repository cargo config links Linux builds with mold, which GitHub runners do not have.
  RUSTFLAGS: ""

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      version: ${{ steps.metadata.outputs.version }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      make_latest: ${{ steps.metadata.outputs.make_latest }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: RustSec audit
        run: cargo audit --deny warnings

      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: cargo xtask release-contract --tag "$RELEASE_TAG" --ref-type "$RELEASE_REF_TYPE"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: cargo xtask release-notes "$VERSION" --output RELEASE_NOTES.md

      - name: Cargo fmt
        run: cargo --locked fmt --all -- --check

      - name: Cargo clippy
        run: cargo --locked clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo --locked test --workspace --all-features --verbose

      - name: Cargo build release
        run: cargo --locked build --workspace --release --all-features

      - name: Upload validated release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            os_name: macos
            arch: x64
          - os: macos-15
            target: aarch64-apple-darwin
            os_name: macos
            arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            os_name: windows
            arch: arm64

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Build and package target
        run: cargo xtask build-release --target ${{ matrix.target }}

      - name: Native smoke test
        if: runner.os == 'Windows'
        run: cargo xtask smoke --artifact releases/windows/codex-discord-rich-presence-windows-${{ matrix.arch }}.exe

      - name: Upload target artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: releases/${{ matrix.os_name }}/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read
      contents: write
    env:
      TAG_NAME: ${{ needs.preflight.outputs.tag_name }}
      VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_NAME: ${{ needs.preflight.outputs.release_name }}
      IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
      MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
      RELEASE_APPROVED_SHA: ${{ vars.RELEASE_APPROVED_SHA }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1

      - name: Download target artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded-artifacts

      - name: Assemble release assets
        run: cargo xtask release-assets --artifact-root downloaded-artifacts --output-directory release-assets

      - name: Verify checksum manifest
        run: |
          set -euo pipefail
          test -s release-assets/SHA256SUMS.txt
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 10
          cd release-assets
          sha256sum --check SHA256SUMS.txt

      - name: Validate approved release target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cargo xtask release-target \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG_NAME" \
            --version "$VERSION" \
            --sha "$RELEASE_SHA" \
            --approved-sha "$RELEASE_APPROVED_SHA" \
            --is-prerelease "$IS_PRERELEASE" \
            --main-ref origin/main

      - name: Refuse release mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          response="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" 2>&1)"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "Release ${TAG_NAME} already exists; refusing to mutate it." >&2
            exit 1
          fi
          if [[ "${response}" != *"HTTP 404"* ]]; then
            echo "${response}" >&2
            exit 1
          fi

      - name: Create draft and upload release assets
        id: draft-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body_path: downloaded-artifacts/release-metadata/RELEASE_NOTES.md
          draft: true
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')" = "true"
          mapfile -t actual_assets < <(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq '.[].name' | sort)
          mapfile -t expected_assets < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#actual_assets[@]}" -eq 10
          diff <(printf '%s\n' "${expected_assets[@]}") <(printf '%s\n' "${actual_assets[@]}")

          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            --jq '.[] | [.name, .digest] | @tsv' | sort > remote-assets.tsv
          while IFS= read -r local_path; do
            asset_name="$(basename "${local_path}")"
            expected_digest="sha256:$(sha256sum "${local_path}" | cut -d' ' -f1)"
            actual_digest="$(awk -F '\t' -v name="${asset_name}" '$1 == name { print $2 }' remote-assets.tsv)"
            test "${actual_digest}" = "${expected_digest}"
          done < <(find release-assets -maxdepth 1 -type f | sort)

      - name: Finalize release once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --argjson prerelease "${IS_PRERELEASE}" \
            --arg make_latest "${MAKE_LATEST}" \
            '{draft: false, prerelease: $prerelease, make_latest: $make_latest}')"
          published_release="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - <<<"${payload}")"
          test "$(jq -r '.draft' <<<"${published_release}")" = "false"
          test "$(jq -r '.prerelease' <<<"${published_release}")" = "${IS_PRERELEASE}"
          test "$(jq -r '.immutable' <<<"${published_release}")" = "true"
          jq '{id, tag_name, draft, prerelease, immutable}' <<<"${published_release}"
